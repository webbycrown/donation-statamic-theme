title: FAQ
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: Question
              validate:
                - required
          -
            handle: order
            field:
              type: integer
              display: Order
              default: 0
          -
            handle: content
            field:
              type: markdown
              display: Answer
              automatic_line_breaks: true
