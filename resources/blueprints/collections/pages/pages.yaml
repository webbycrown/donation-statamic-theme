title: Pages
tabs:
  main:
    display: Page
    sections:
      -
        display: Content
        fields:
          -
            handle: title
            field:
              type: text
              display: Title
              validate:
                - required
          -
            handle: excerpt
            field:
              type: textarea
              display: Excerpt
              instructions: Short intro. Optional.
      -
        display: Theme sections
        instructions: Every page uses the same Page template. Add any section here and drag to reorder.
        fields:
          -
            import: page_builder
      -
        display: Page chrome
        fields:
          -
            handle: template
            field:
              type: hidden
              default: page
          -
            handle: body_class
            field:
              type: text
              display: Body Class
              instructions: Optional CSS class on &lt;body&gt;. Use "transperent" for transparent header.
          -
            handle: transparent_header
            field:
              type: toggle
              display: Transparent Header
          -
            handle: show_loader
            field:
              type: toggle
              display: Show page loader
          -
            handle: header_style
            field:
              type: select
              display: Header style
              options:
                '': Default
                three: Style three (top bar)
          -
            handle: hide_footer
            field:
              type: toggle
              display: Hide footer
          -
            handle: image
            field:
              type: assets
              display: Fallback image
              container: assets
              max_files: 1
  seo:
    display: SEO
    sections:
      -
        display: Search and social
        fields:
          -
            import: seo
