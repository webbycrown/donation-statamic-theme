{{ inner_pages }}
<div class="col-sm-12 col-md-6 col-lg-4 col-xl-4 js-inner-page-card{{ if count > 9 }} is-hidden{{ /if }}">
    <a href="{{ url }}" class="inner-image-grid">
        <div class="page-img"><img src="{{ image }}" alt="{{ title }}"></div>
        <h5>{{ title }}</h5>
    </a>
</div>
{{ /inner_pages }}
