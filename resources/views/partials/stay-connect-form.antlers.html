{{ form:contact action="/!/forms/contact" ajax="true" class="js-donation-form" }}
<div class="contact-form stay-connect-form" data-aos="fade-up" data-aos-duration="1500">
    <div class="stay-connect-success" {{ unless success }}hidden{{ /unless }}>
        <span class="stay-connect-success__icon" aria-hidden="true"><i class="fa-solid fa-check"></i></span>
        <h3>Message sent successfully</h3>
        <p>Thank you for connecting with us. Our team has received your message and will get back to you shortly.</p>
    </div>
    <div class="stay-connect-fields" {{ if success }}hidden{{ /if }}>
        <div class="stay-connect-alert stay-connect-alert--error" hidden></div>
        <div class="nema-and-number">
            <input type="text" class="form-control" name="first_name" value="{{ old:first_name }}" placeholder="First name" required>
            <input type="email" class="form-control" name="email" value="{{ old:email }}" placeholder="Email" required>
        </div>
        <div class="email-and-submit">
            <input type="text" class="form-control" name="phone" value="{{ old:phone }}" placeholder="Phone">
            <input type="text" class="form-control" name="subject" value="{{ old:subject }}" placeholder="Subject">
        </div>
        <textarea class="form-control" name="message" placeholder="Message">{{ old:message }}</textarea>
        <div class="contact-form-button">
            <button type="submit" class="btn btn-primary">
                <span class="btn-label">Send</span>
                <span class="btn-loading" hidden>Sending…</span>
            </button>
        </div>
    </div>
</div>
{{ /form:contact }}
