<!-- Donation timeline -->
{{ if items }}
<section class="donation-timeline" style="padding: 80px 0; background: #FFF8F8;">
    <div class="container">
        <div class="row">
            <div class="col-12">
                {{ if kicker }}<p class="wc-kicker" data-aos="fade-up">{{ kicker }}</p>{{ /if }}
                {{ if heading }}<h2 class="wc-sub-title text-center" data-aos="fade-up" data-aos-duration="1500">{{ heading }}</h2>{{ /if }}
            </div>
        </div>
        <div class="row" style="margin-top: 48px;">
            {{ items }}
            <div class="col-md-4 col-sm-12" data-aos="fade-up" data-aos-duration="1500" style="text-align:center; padding: 24px;">
                {{ if year }}<p style="font-weight:700; color:#425F57; font-size:18px; margin-bottom:4px;">{{ year }}</p>{{ /if }}
                {{ if amount }}<h3 style="font-size:36px; color:#425F57; font-weight:800; margin-bottom:8px;">{{ amount }}</h3>{{ /if }}
                {{ if description }}<p style="color:#5a6b66;">{{ description }}</p>{{ /if }}
            </div>
            {{ /items }}
        </div>
    </div>
</section>
{{ /if }}
