<!-- Donation success message -->
<section class="wc-donation-success">
    <div class="container p-0">
        <div class="row">
            <div class="col-12 p-0">
                <div class="inner-success" style="text-align:center; padding: 80px 40px;">
                    <span class="stay-connect-success__icon" style="display:inline-flex; width:80px; height:80px; border-radius:50%; background:#CFFF8D; color:#425F57; align-items:center; justify-content:center; font-size:32px; margin-bottom:24px;" aria-hidden="true">
                        <i class="fa-solid fa-heart"></i>
                    </span>
                    <h2>{{ heading ?? "Thank you for your support" }}</h2>
                    {{ if body }}
                    <div style="max-width:600px; margin:0 auto 32px;">{{ body }}</div>
                    {{ else }}
                    <p style="max-width:600px; margin:0 auto 32px;">We have received your donation inquiry and will be in touch. This form sends an email notification — no payment has been captured.</p>
                    {{ /if }}
                    <a href="{{ cta_url ?? '/' }}" class="btn btn-primary">{{ cta_label ?? 'Back to home' }}</a>
                </div>
            </div>
        </div>
    </div>
</section>
