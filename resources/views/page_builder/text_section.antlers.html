<!-- Text section -->
<section class="text-section" style="padding: 60px 0;">
    <div class="container">
        <div class="row">
            <div class="col-12">
                {{ if heading }}<h2 data-aos="fade-up" data-aos-duration="1500">{{ heading }}</h2>{{ /if }}
                {{ if body }}<div class="text-section-body" data-aos="fade-up" data-aos-duration="1500">{{ body }}</div>{{ /if }}
            </div>
        </div>
    </div>
</section>
