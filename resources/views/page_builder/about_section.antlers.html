<!-- About section (home two style) -->
<section class="about-section">
    <div class="container">
        <div class="row">
            <div class="col-12">
                <div class="content-wrap">
                    {{ if heading }}<h2 class="title" data-aos="fade-up" data-aos-duration="1500">{{ heading }}</h2>{{ /if }}
                    {{ if text }}<p data-aos="fade-right" data-aos-duration="1500" class="text-center">{{ text }}</p>{{ /if }}
                    {{ if button_label }}
                    <div class="about-btn" data-aos="fade-up" data-aos-duration="1500">
                        <a href="{{ button_url ?? '/about-us' }}" class="btn btn-primary mx-auto">{{ button_label }}</a>
                    </div>
                    {{ /if }}
                </div>
                {{ if images }}
                <div class="about-img-wrap">
                    {{ images }}
                    <div class="image-wrap"><img src="{{ url }}" alt="{{ heading }}"></div>
                    {{ /images }}
                </div>
                {{ /if }}
            </div>
        </div>
    </div>
</section>
