<!-- Partners / sponsors logo strip -->
{{ if logos }}
<section class="partners-section" style="padding: 60px 0; background:#FFF8F8;">
    <div class="container">
        <div class="row">
            <div class="col-12">
                {{ if kicker }}<p class="wc-kicker" data-aos="fade-up">{{ kicker }}</p>{{ /if }}
                {{ if heading }}<h2 class="wc-sub-title text-center" data-aos="fade-up" data-aos-duration="1500">{{ heading }}</h2>{{ /if }}
            </div>
        </div>
        <div class="row align-items-center justify-content-center" style="margin-top:32px; gap:24px 0;">
            {{ logos }}
            <div class="col-6 col-md-3 col-lg-2 text-center" data-aos="fade-up">
                <img src="{{ url }}" alt="Partner" style="max-height:60px; width:auto; filter:grayscale(1); opacity:0.7; transition:opacity .2s;" onmouseover="this.style.opacity=1;this.style.filter='grayscale(0)'" onmouseout="this.style.opacity=0.7;this.style.filter='grayscale(1)'">
            </div>
            {{ /logos }}
        </div>
    </div>
</section>
{{ /if }}
